<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Ferreluc</title>
  <style>
    body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,Cantarell,Noto Sans,Arial;background:#0b1220;color:#e6edf3;display:grid;place-items:center;height:100vh}
    .card{max-width:680px;margin:16px;background:#111a2b;border:1px solid #22304d;border-radius:14px;padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
    h1{margin:0 0 8px;font-size:28px}
    p{margin:6px 0;color:#a8b3c7;line-height:1.5}
    .pill{display:inline-block;background:#0e7afe;color:#fff;padding:6px 10px;border-radius:999px;font-weight:700;font-size:12px;margin-bottom:10px}
    a{color:#77b7ff;text-decoration:none}
  </style>
</head>
<body>
  <main class="card">
    <div class="pill">Ferretería</div>
    <h1>Ferreluc</h1>
    <p>Sitio en construcción. Venta de insumos y herramientas.</p>
    <p>Contacto: <a href="mailto:info@ferreluc.com">info@ferreluc.com</a></p>
  </main>
</body>
</html>
